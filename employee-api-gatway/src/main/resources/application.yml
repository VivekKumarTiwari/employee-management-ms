spring:
  application:
    name: employee-api-gatway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: employee-auth-services
              uri: lb://employee-auth-services
              predicates:
                - Path=/api/auth/**
            - id: department-management-service
              uri: lb://department-management-service
              predicates:
                - Path=/api/departments
            - id: employee-management-service
              uri: lb://employee-management-service
              predicates:
                - Path=/api/employees
server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

