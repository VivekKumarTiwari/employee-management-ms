spring.application.name=employee-management-service

server.port=9080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:employeedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=root

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console (web UI)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


resilience4j.retry.instances.departmentclient.max-attempts=5
resilience4j.retry.instances.departmentclient.wait-duration=500ms


resilience4j.circuitbreaker.instances.departmentclient.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.departmentclient.failure-rate-threshold=2
resilience4j.circuitbreaker.instances.departmentclient.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.departmentclient.sliding-window-size=10
resilience4j.circuitbreaker.instances.departmentclient.sliding-window-type=count_based
